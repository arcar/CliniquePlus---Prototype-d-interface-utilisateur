<div class="container">

  <div class="card">

    <h2>Analyse d'une nuit</h2>

    <p class="subtitle">
      Sélectionnez la nuit à analyser ainsi que le médecin validateur.
    </p>

    <form [formGroup]="commentForm" (ngSubmit)="submit()">

      <div class="row">

        <div class="field">

          <label>Nuit à analyser</label>

          <select formControlName="selectedNuit"
                  [disabled]="loadingNuits || !nuits.length">

            <option [ngValue]="null">
              Choisir une nuit
            </option>

            <option *ngFor="let nuit of nuits" [ngValue]="nuit">
              Nuit n° {{ nuit.id_nuit }}
            </option>

          </select>

        </div>

        <div class="field">

          <label>Médecin validateur</label>

          <select formControlName="selectedMedecin"
                  [disabled]="loadingMedecins || !docs.length">

            <option [ngValue]="null">
              Choisir un médecin
            </option>

            <option *ngFor="let doc of docs" [ngValue]="doc">
              Dr {{ doc.prenom }} {{ doc.nom }} : {{ doc.specialite }}
            </option>

          </select>

        </div>

      </div>

      <div class="field">

        <label for="comment">Commentaire médical pour médecin validateur</label>

        <textarea
          id="comment"
          formControlName="comment"
          rows="6"
          placeholder="Saisir un commentaire destiné au médecin validateur...">
        </textarea>

        <small class="error"
               *ngIf="commentForm.get('comment')?.invalid && commentForm.get('comment')?.touched">

          Commentaire invalide

        </small>

      </div>

      <button class="btn" type="submit" [disabled]="commentForm.invalid">
        Lancer ETL 1
      </button>

    </form>

  </div>

</div>
