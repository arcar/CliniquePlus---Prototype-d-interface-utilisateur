
<form (ngSubmit)="seConnecter()" #loginForm="ngForm" class="login-form">

  <h1 class="title">ACCESS SYSTEM</h1>

  <input
    id="inputIdentifiant"
    name="email"
    type="text"
    [(ngModel)]="email"
    placeholder="Identifiant"
    required
    autocomplete="username"
  />

  <input
    id="inputMdp"
    name="password"
    type="password"
    [(ngModel)]="password"
    placeholder="Mot de passe"
    required
    autocomplete="current-password"
  />

  <button
    class="btn"
    type="submit"
    [disabled]="loginForm.invalid"
    data-label="Se connecter"
  >
    Se connecter
  </button>

</form>

<!-- MESSAGE GLOBAL (hors form pour bien le détacher visuellement) -->
<p class="message" *ngIf="this.userService.message()">
  {{ this.userService.message() }}
</p>
