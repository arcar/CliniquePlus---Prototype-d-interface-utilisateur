<nav>
  @if (userService.isConnected()) {

    <!-- =========================
         LEFT NAV
    ========================== -->
    <div class="nav-left">
      <a routerLink="/">Accueil</a>
      <a routerLink="/analysenuit">Analyse nuit</a>
    </div>

    <!-- =========================
         CENTER (compte)
    ========================== -->
    <div class="nav-center">
      <span class="job-label">
        Compte : {{ routes.job()?.source?.toUpperCase() }}
      </span>
    </div>

    <!-- =========================
         RIGHT USER AREA
    ========================== -->
    <div class="user-section">

      <span class="user-text">
        Bonjour {{ userService.user()?.prenom }}
      </span>

      <button
        #avatarBtn
        class="avatar-btn"
        type="button"
        (click)="toggleUserMenu()">

        <span>
          {{ userService.user()?.prenom?.charAt(0)?.toUpperCase() }}
        </span>

      </button>

      @if (isOpened) {
        <div class="dropdown" #dropdownMenu>

          <a routerLink="/infouser" (click)="fermerUserParam()">
            Mon profil
          </a>

          <a
            class="logout"
            routerLink="/"
            (click)="userService.logOut(); fermerUserParam()">

            Se déconnecter
          </a>

        </div>
      }

    </div>

  } @else {

    <!-- =========================
         GUEST MODE
    ========================== -->
    <div class="nav-left">
      <a routerLink="/">Accueil</a>
      <a routerLink="/login">Connexion</a>
    </div>

  }
</nav>
